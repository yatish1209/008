<title>Composite Materials MCQ — 100 Questions</title>
<style>
:root{--bg:#E9EEF2;--panel:#F8FAFB;--ink:#16222D;--muted:#5B6B79;--line:#C8D2DB;--accent:#2B5F8E;--accent-ink:#fff;--ok:#1F6F52;--okbg:#DDF0E7;--bad:#A93244;--badbg:#F6DDE1;--chip:#DCE5EC}
:root[data-theme="dark"]{--bg:#10161C;--panel:#18212A;--ink:#E4EBF1;--muted:#93A3B1;--line:#2B3843;--accent:#79ABD6;--accent-ink:#0E1620;--ok:#5FC59B;--okbg:#16342A;--bad:#F08A99;--badbg:#3A1E25;--chip:#223140}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0 14px}
h1{font:700 1.25rem/1.2 Georgia,"Iowan Old Style",serif;margin:0;letter-spacing:.2px}
h1 small{display:block;font:500 .78rem/1.3 system-ui,sans-serif;color:var(--muted);margin-top:3px}
.score{display:flex;gap:8px;align-items:center}
.chip{background:var(--chip);border-radius:999px;padding:4px 12px;font-size:.85rem;white-space:nowrap}
button,select{font:inherit;color:inherit}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.controls{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;margin-bottom:12px}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px;width:100%}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prog{margin:4px 0 16px}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.prog p{margin:6px 0 0;font-size:.85rem;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:.85rem;color:var(--muted)}
.tag{background:var(--chip);border-radius:6px;padding:2px 8px;color:var(--ink)}
.star{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
.star.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.q{font:1.2rem/1.5 Georgia,"Iowan Old Style",serif;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{flex:0 0 26px;height:26px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .k{background:var(--ok);color:var(--accent-ink)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .k{background:var(--bad);color:var(--accent-ink)}
.expl{margin-top:16px;padding:12px 14px;border-left:4px solid var(--accent);background:var(--bg);border-radius:0 8px 8px 0}
.expl b{display:block;margin-bottom:4px}
.expl.ok b{color:var(--ok)}.expl.bad b{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.jump{margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:10px}
.grid button{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;font-size:.78rem;padding:0}
.grid button.ok{background:var(--okbg);border-color:var(--ok)}
.grid button.bad{background:var(--badbg);border-color:var(--bad)}
.grid button.cur{outline:2px solid var(--accent)}
.empty{text-align:center;color:var(--muted);padding:32px 8px}
.foot{margin-top:24px;text-align:center;color:var(--muted);font-size:.8rem}
@media(max-width:560px){.controls{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(8,1fr)}.card{padding:16px}.q{font-size:1.08rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

so it debonds and pulls out; it may still add toughness."}, {"t": "Fundamentals", "q": "Which statement about the fibre–matrix interface in a composite is most accurate?", "o": ["A stronger interface always produces the toughest composite", "The interface influences only the longitudinal stiffness", "A very weak interface reduces load transfer and strength but can raise toughness via debonding and pull-out", "The interface is classed as part of the reinforcement phase"], "a": 2, "e": "Interface strength trades off strength/stiffness (efficient load transfer) against toughness (energy absorbed in debonding and pull-out)."}, {"t": "Fundamentals", "q": "Specific stiffness of a material is defined as:", "o": ["Strength divided by density", "Strength divided by elastic modulus", "Elastic modulus multiplied by failure strain", "Elastic modulus divided by density"], "a": 3, "e": "Specific stiffness = E/ρ; specific strength = strength/ρ. Composites such as CFRP score high on both."}, {"t": "Fundamentals", "q": "Bamboo is described as a natural functionally graded material because:", "o": ["Vascular bundles are densest near the inner cavity", "Vascular-bundle density increases towards the outer wall of the culm", "Lignin content falls steadily from node to node", "Wall thickness is uniform, but the fibre length varies"], "a": 1, "e": "Fibre-rich vascular bundles concentrate near the outer skin, so strength and stiffness are graded across the wall thickness."}, {"t": "Fundamentals", "q": "A hybrid composite is one that:", "o": ["Is made only of cement blended with polymer", "Contains natural and synthetic parts that remain separate components", "Is a laminate with alternating orientations of the same fibre", "Uses two or more types of reinforcement (or matrices) within the same composite"], "a": 3, "e": "Hybrid composites combine, for example, glass and jute fibres in one matrix to balance cost, stiffness and toughness."}, {"t": "Fundamentals", "q": "Laminates are commonly designed symmetric about the mid-plane mainly to avoid:", "o": ["Buckling of fibres under compression", "Warping and twisting caused by bending–extension coupling", "Galvanic corrosion between plies", "Moisture wicking along fibre direction"], "a": 1, "e": "Symmetry makes the coupling (B) matrix zero, so in-plane loading or temperature change does not curve the laminate."}, {"t": "Fundamentals", "q": "The interfacial transition zone (ITZ) in concrete is best described as:", "o": ["A dense zone stronger than bulk paste produced by the wall effect", "A relatively porous, weaker zone, tens of micrometres thick, around aggregate particles", "A zone at the steel–concrete interface where carbonation begins", "A zone of unhydrated cement at the outer surface of the member"], "a": 1, "e": "Poor particle packing near aggregate surfaces gives higher porosity and larger Ca(OH)₂ crystals — the weak link in normal concrete and the reason UHPC removes coarse aggregate."}, {"t": "Steel–Concrete", "q": "In unpropped composite beam construction, which check is essential at the construction stage?", "o": ["Composite section carrying wet concrete", "Slab reinforcement in the hogging zone", "Bare steel section carrying wet concrete and construction load", "Shear connectors carrying only the steel self-weight"], "a": 2, "e": "Before the concrete gains strength there is no composite action, so the steel beam alone carries the wet concrete and construction loads."}, {"t": "Steel–Concrete", "q": "The effective flange width of the slab in a composite beam depends chiefly on:", "o": ["Stud diameter and stud spacing", "Span length and beam spacing, accounting for shear lag", "The actual slab width between beam webs", "Deck rib orientation alone"], "a": 1, "e": "Shear lag makes stress non-uniform across the slab, so codes limit the participating width to a function of span and beam spacing."}, {"t": "Steel–Concrete", "q": "Partial shear connection in composite beams is generally permitted when:", "o": ["Ductile connectors are used and a minimum degree of connection is satisfied", "Only rigid connectors are provided, because they limit slip", "Any connector type is used, since bond ensures shear transfer", "The beam is a cantilever"], "a": 0, "e": "Ductile (flexible) studs can redistribute shear, so fewer connectors than full connection are allowed above a code minimum degree of connection."}, {"t": "Steel–Concrete", "q": "A headed stud with a height-to-diameter ratio of at least about 4 is preferred mainly to:", "o": ["Increase weld penetration through the decking", "Reduce concrete shrinkage around the stud", "Meet the fire rating of the stud shank", "Develop ductile behaviour with the head resisting slab uplift"], "a": 3, "e": "Adequate height and a head give stud yielding (ductile) rather than premature concrete failure, and resist vertical separation."}, {"t": "Steel–Concrete", "q": "In a composite slab with a re-entrant (dovetail) profile, the main source of longitudinal shear resistance is:", "o": ["Mechanical interlock from the re-entrant shape and embossments", "Chemical bond between zinc coating and cement paste", "Friction from shrinkage alone", "Stirrups placed in the concrete topping"], "a": 0, "e": "Chemical bond is unreliable once slip begins; interlock (plus end anchorage) provides dependable longitudinal shear transfer."}, {"t": "Steel–Concrete", "q": "The m–k method in composite slab design is used to determine:", "o": ["Effective width of the slab flange", "Buckling length of composite columns", "Longitudinal shear resistance from full-scale tests", "Fatigue life of headed studs"], "a": 2, "e": "Empirical constants m and k are obtained from tests on a given deck profile and used to check longitudinal shear."}, {"t": "Steel–Concrete", "q": "In the hogging region of a continuous composite beam, a critical check is:", "o": ["Crushing of the slab in compression", "Pull-out of studs in the sagging region", "Web crippling caused by deck ribs", "Lateral-torsional (distortional) buckling of the bottom flange"], "a": 3, "e": "In hogging, the steel bottom flange is in compression and is restrained only by web flexibility, so distortional buckling can govern."}, {"t": "Steel–Concrete", "q": "In a concrete-filled steel tube (CFT), the principal role of the infill in a thin-walled tube is to:", "o": ["Raise the tensile capacity of the tube", "Restrain inward local buckling of the steel wall", "Reduce the yield strength demand on the steel", "Prevent lateral-torsional buckling of the tube"], "a": 1, "e": "Concrete prevents inward buckling so the steel can reach yield; the tube in turn confines the concrete."}, {"t": "Steel–Concrete", "q": "In a rectangular CFT, the confinement of the concrete core is limited mainly because:", "o": ["Steel tubes have no lateral stiffness", "Concrete expands less than steel under load", "Flat walls bow outward, so hoop action is effective mostly near the corners", "Weld seams eliminate hoop tension"], "a": 2, "e": "Circular tubes provide uniform hoop tension; flat faces of square/rectangular tubes deform outward, reducing confinement."}, {"t": "Steel–Concrete", "q": "Structural steel retains roughly half of its room-temperature yield strength at about:", "o": ["300–350 °C", "450–480 °C", "550–600 °C", "750–800 °C"], "a": 2, "e": "Around 550–600 °C steel loses about half its yield strength (the classic critical-temperature concept), which is why unprotected steel needs fire protection."}, {"t": "Steel–Concrete", "q": "The effect of differential shrinkage in a composite beam is that:", "o": ["Steel shrinks more than concrete, lifting the slab", "Restrained slab shrinkage induces tension in the slab and additional curvature and deflection", "Shrinkage relieves stud shear at supports", "Shrinkage lowers the modular ratio in hogging zones only"], "a": 1, "e": "Concrete shrinks, the steel beam restrains it, so the slab is put in tension and the member curves — a serviceability concern."}, {"t": "Steel–Concrete", "q": "Compared with the short-term value, the modular ratio used for long-term loads on a composite section is:", "o": ["Smaller, because concrete stiffens with age", "Larger, to account for creep of the concrete", "The same, because creep affects only steel", "Taken as unity for a fully composite section"], "a": 1, "e": "Creep lowers the effective concrete modulus, so the long-term modular ratio (Es/Ec,eff) is higher."}, {"t": "Steel–Concrete", "q": "Which is NOT an advantage claimed for composite beams over non-composite steel beams?", "o": ["Higher flexural stiffness and lower deflection", "Reduced structural steel tonnage for the same span", "A shallower section for the same span", "Removal of the need to fire-protect the exposed bottom flange"], "a": 3, "e": "Composite action improves stiffness and economy, but the bottom flange remains exposed and generally still needs fire protection."}, {"t": "Steel–Concrete", "q": "In elastic design, the longitudinal shear flow at the steel–concrete interface of a composite beam is computed from:", "o": ["V·A·ȳ / I using transformed-section properties about the composite neutral axis", "V·y / A_c using the slab area only", "M divided by lever arm and span", "T / (2·A·t) as for a closed thin-walled section"], "a": 0, "e": "Shear flow q = V·Q/I, with Q the first moment of the transformed slab area and I of the transformed section."}, {"t": "Steel–Concrete", "q": "Under full shear connection, the horizontal shear to be resisted between a zero-moment section and the adjacent maximum-moment section is limited by the lesser of:", "o": ["Steel tensile capacity and concrete compressive capacity of the effective slab", "Steel yield force and slab longitudinal reinforcement capacity", "Concrete tensile capacity and steel compressive capacity", "Steel plastic moment divided by stud diameter"], "a": 0, "e": "At plastic collapse the interface shear equals the smaller of the two: yield force in steel (tension) or crushing force in the effective concrete."}, {"t": "Steel–Concrete", "q": "A simply supported composite beam needs 1200 kN of horizontal shear transferred between each support and midspan. If each stud has a design resistance of 75 kN, the minimum number of studs over the whole span is:", "o": ["16", "24", "32", "64"], "a": 2, "e": "1200 / 75 = 16 studs per half-span; there are two half-spans, so 32 in total (spacing may vary with shear distribution)."}, {"t": "Steel–Concrete", "q": "The nominal mesh placed in the topping of a composite slab is mainly for:", "o": ["Acting as the main tension reinforcement", "Replacing shear studs at the supports", "Controlling shrinkage and temperature cracking and aiding load distribution", "Increasing chemical bond between deck and concrete"], "a": 2, "e": "The deck provides sagging reinforcement; the mesh handles cracking control (and some fire/lateral distribution) requirements."}, {"t": "Steel–Concrete", "q": "Headed shear studs are usually welded through profiled decking by:", "o": ["Manual metal-arc welding with stick electrodes", "Oxy-acetylene brazing", "Submerged-arc welding", "Drawn-arc stud welding"], "a": 3, "e": "Automated drawn-arc stud welding fuses the stud through the galvanised deck to the beam flange."}, {"t": "Steel–Concrete", "q": "Which connection type generally gives the highest stiffness in timber–concrete composite floors?", "o": ["Vertical nails alone", "Plain friction between timber and concrete", "Notched connections with steel fasteners", "Glued-in thin dowels of low stiffness"], "a": 2, "e": "Notches transfer shear by bearing and give very stiff, efficient composite action; nails/dowels alone are much more flexible."}, {"t": "Steel–Concrete", "q": "Which supertall building relies on composite mega-columns of steel box sections filled with high-strength concrete?", "o": ["Burj Khalifa", "Petronas Twin Towers", "Taipei 101", "Willis (Sears) Tower"], "a": 2, "e": "Taipei 101 uses concrete-filled steel box mega-columns. Burj Khalifa is buttressed reinforced concrete, Petronas is high-strength RC, and Willis Tower is a bundled steel tube."}, {"t": "Cementitious & FRC", "q": "The chief benefit of adding steel fibres to concrete is:", "o": ["A 40% increase in elastic modulus", "Reduced autogenous shrinkage", "A rise of more than 50% in compressive strength", "Improved post-cracking toughness and energy absorption"], "a": 3, "e": "Fibres bridge cracks and delay failure, greatly increasing toughness; compressive strength and modulus change only slightly."}, {"t": "Cementitious & FRC", "q": "If the fibre volume fraction is below the critical volume fraction, a fibre composite under tension typically:", "o": ["Shows strain-hardening with multiple cracking", "Fails soon after matrix cracking because fibres cannot carry the released load", "Pulls fibres out only after 3% strain", "Has a tensile strength equal to that of the fibres alone"], "a": 1, "e": "Below Vcrit the fibres are too few to take the load transferred at first cracking, so the composite softens and fails."}, {"t": "Cementitious & FRC", "q": "The micromechanical design criterion for pseudo-strain-hardening in ECC requires that:", "o": ["Fibre modulus must be lower than matrix modulus", "Fibre bridging strength exceeds matrix cracking strength, with an energy criterion also satisfied", "Coarse aggregate must be graded up to 20 mm", "Water–binder ratio must exceed 0.60"], "a": 1, "e": "Steady-state flat-crack propagation (energy criterion) plus bridging stress > first-crack strength yields multiple fine cracks and strain-hardening."}, {"t": "Cementitious & FRC", "q": "UHPC omits coarse aggregate mainly to:", "o": ["Lower the cement demand", "Increase creep deformation", "Improve homogeneity and packing while removing weak ITZ around large particles", "Because fibres cannot be mixed with aggregate"], "a": 2, "e": "Fine powders and a very low w/b give a dense, homogeneous matrix; removing coarse aggregate eliminates large weak interfaces."}, {"t": "Cementitious & FRC", "q": "Crack widths in ferrocement are very small mainly because of:", "o": ["Thick concrete cover over the mesh", "The large specific surface of closely spaced fine mesh reinforcement", "A high water–cement ratio", "The use of a few high-strength bars"], "a": 1, "e": "A large specific surface area gives efficient bond and distributes strain, producing many fine cracks."}, {"t": "Cementitious & FRC", "q": "Which mortar specification is typical for ferrocement?", "o": ["Sand–cement ratio about 1.5–2.5 by weight, w/c about 0.40–0.45", "Sand–cement 4:1, w/c 0.70", "10 mm coarse aggregate, w/c 0.55", "Lime–sand 1:3, w/c 0.90"], "a": 0, "e": "A rich, workable, low w/c mortar without coarse aggregate is needed to penetrate the mesh layers."}, {"t": "Cementitious & FRC", "q": "Loss of ductility of aged GRC is chiefly attributed to:", "o": ["Corrosion of steel bar spacers", "Carbon dioxide reacting with glass surfaces only", "Ultraviolet damage to the glass", "Precipitation of Ca(OH)₂ and alkali attack around fibre filaments, embrittling the composite"], "a": 3, "e": "Hydration products fill the spaces between filaments and the fibres are attacked in the alkaline environment, reducing pull-out and ductility."}, {"t": "Cementitious & FRC", "q": "Explosive spalling of dense concrete in fire is mainly caused by:", "o": ["Alkali–silica reaction in aggregates", "Chloride-induced steel corrosion", "Build-up of pore vapour pressure combined with thermal stress", "Carbonation shrinkage"], "a": 2, "e": "Low permeability traps steam; pressure plus thermal gradients cause sudden surface spalling."}, {"t": "Cementitious & FRC", "q": "The minimum concrete cover in textile-reinforced concrete is governed mainly by:", "o": ["Bond, anchorage and fabrication tolerance rather than corrosion protection", "Chloride-induced corrosion of carbon", "The 25 mm cover required for RCC", "Nothing; cover is not required"], "a": 0, "e": "Carbon and AR-glass textiles do not corrode like steel, so thin sections are possible, but the textile must still be embedded and anchored."}, {"t": "Cementitious & FRC", "q": "The large strength gain of polymer-impregnated concrete is mainly due to:", "o": ["Increased degree of cement hydration", "Formation of additional ettringite", "A larger maximum aggregate size", "Polymer filling pores and micro-voids, reducing porosity"], "a": 3, "e": "Monomer soaked into dried concrete is polymerised in place, sealing the pore system and lifting strength and impermeability."}, {"t": "Cementitious & FRC", "q": "Fibre balling in steel-fibre concrete is most associated with:", "o": ["High aspect ratio and dosage combined with poor dispersion during mixing", "A very low water–cement ratio only", "Low fibre modulus", "Use of a superplasticiser"], "a": 0, "e": "Long, dense fibres added too quickly or to a stiff mix tangle into clumps; fibre addition method and mix design control this."}, {"t": "Cementitious & FRC", "q": "Which statement about workability of fibre-reinforced concrete is correct?", "o": ["Slump is best for FRC and Vebe is unsuitable", "Fibres always increase slump", "Fibres reduce workability, and Vebe or inverted slump cone tests are more sensitive than the slump test", "Workability is independent of fibre aspect ratio"], "a": 2, "e": "Fibres restrict flow; slump may look adequate while mix is hard to compact, so Vebe/inverted slump cone are preferred."}, {"t": "Cementitious & FRC", "q": "Flexural toughness of fibre-reinforced concrete is best quantified by:", "o": ["Area under the load–deflection curve up to a specified deflection", "Peak flexural load divided by span", "Initial slope of the elastic portion", "The ratio of cube to cylinder strength"], "a": 0, "e": "Toughness represents absorbed energy; standards use areas or residual strengths at specified deflections (e.g. ASTM C1609)."}, {"t": "Cementitious & FRC", "q": "The Krenchel orientation efficiency factor for fibres randomly oriented in three dimensions is about:", "o": ["1.0", "0.375", "0.2", "0.5"], "a": 2, "e": "Krenchel factors: aligned 1.0, two-dimensional random 0.375, three-dimensional random 0.2."}, {"t": "Cementitious & FRC", "q": "Hooked-end steel fibres are preferred over straight fibres mainly because:", "o": ["They lower the cost per kilogram", "They improve chloride resistance", "Mechanical anchorage greatly improves pull-out resistance", "They increase slump"], "a": 2, "e": "The deformed ends resist pull-out, giving better post-crack performance for the same dosage."}, {"t": "FRP", "q": "FRP-reinforced concrete beams are generally designed to be over-reinforced (concrete crushing governs) because:", "o": ["FRP rupture is gradual and ductile", "Concrete crushing gives more warning than sudden FRP rupture", "Over-reinforcement lowers the FRP modulus", "Cracks cannot form in over-reinforced sections"], "a": 1, "e": "FRP is linear-elastic to rupture, so a concrete-crushing failure with some inelastic deformation is the preferred mode."}, {"t": "FRP", "q": "Deflections of GFRP-reinforced beams are typically larger than those of steel-reinforced beams mainly because:", "o": ["The low elastic modulus of GFRP reduces cracked-section stiffness", "GFRP bars have a lower ultimate strain than steel", "Concrete shrinks more when GFRP is used", "GFRP relaxes under sustained load"], "a": 0, "e": "GFRP modulus is roughly a fifth to a quarter of steel, so cracked stiffness is much lower."}, {"t": "FRP", "q": "Compared with a steel bar of the same diameter, the development length of an FRP bar is generally:", "o": ["Shorter, because FRP is lighter", "Identical for all bar types", "Longer, because of bond characteristics and the need to develop a high tensile force at low modulus", "Independent of surface texture"], "a": 2, "e": "Codes such as ACI 440.1R give longer development lengths for FRP; surface treatment strongly influences bond."}, {"t": "FRP", "q": "Shear strength of FRP-RC beams without stirrups is usually lower than for equivalent steel-RC beams because:", "o": ["FRP bars are stiffer than steel", "Concrete strength is lower in FRP-RC", "FRP bars carry no tension", "Wider cracks reduce aggregate interlock, and FRP bars offer little dowel action"], "a": 3, "e": "Low modulus and weak transverse strength lead to wider cracks and small dowel capacity."}, {"t": "FRP", "q": "For a factory-bent FRP stirrup or bar, the strength at the bend is:", "o": ["Markedly lower than the strength of the straight portion", "Higher because fibres are compacted at the bend", "The same as the straight portion", "Governed only by yielding"], "a": 0, "e": "Bending induces fibre curvature and transverse stresses, so codes reduce the strength at bends."}, {"t": "FRP", "q": "For FRP confinement of columns, the most effective and reliable geometry is:", "o": ["Square section with sharp corners", "Circular section, or rectangular with rounded corners", "Any shape equally", "Rectangular with a high aspect ratio"], "a": 1, "e": "Circular sections confine uniformly; sharp corners cause stress concentrations that rupture the wrap prematurely."}, {"t": "FRP", "q": "A common failure mode of externally bonded FRP flexural strengthening is:", "o": ["Fibre creep failure", "Intermediate crack-induced debonding or plate-end peeling", "Matrix melting", "Galvanic corrosion of the fibre"], "a": 1, "e": "The bond, not the fibre strength, usually limits capacity — hence strain limits and end anchorage."}, {"t": "FRP", "q": "Compared with externally bonded strips, near-surface mounted (NSM) FRP typically offers:", "o": ["Lower material cost per metre", "Higher fibre modulus", "No need for adhesive", "Better anchorage and protection with less surface preparation"], "a": 3, "e": "Strips placed in grooves are embedded on more faces, giving greater bond and protection from impact and fire."}, {"t": "FRP", "q": "ACI 440.2R advises that the service temperature of an externally bonded FRP system should remain:", "o": ["Equal to the Tg", "About 20 °C above the Tg", "At least about 15 °C below the Tg of the adhesive/resin", "Independent of the Tg"], "a": 2, "e": "Above Tg the polymer softens and bond/stiffness degrade sharply, so a margin below Tg is required."}, {"t": "FRP", "q": "Pultrusion differs from extrusion in that the product is:", "o": ["Pushed through a die from a melt", "Pulled through a heated die, with continuous fibres impregnated and cured in the die", "Sprayed on a mould", "Wound around a rotating mandrel"], "a": 1, "e": "Continuous rovings are pulled through a resin bath and a heated die, giving constant-section profiles."}, {"t": "FRP", "q": "A galvanic issue with carbon FRP in contact with steel in the presence of moisture is that:", "o": ["Steel acts as a sacrificial anode that protects the carbon", "GFRP always causes galvanic corrosion", "Carbon acts as a cathode and can accelerate corrosion of the steel", "There is no galvanic effect"], "a": 2, "e": "Carbon is a noble, conductive material; isolating layers (e.g. glass) are used where it touches steel."}, {"t": "FRP", "q": "The alkali resistance of AR glass fibre is mainly due to its content of:", "o": ["Alumina", "Boron oxide", "A carbon coating", "Zirconia (ZrO₂), around 16–20%"], "a": 3, "e": "Zirconium oxide makes the glass network resistant to hydroxyl attack in cement pore solution."}, {"t": "FRP", "q": "A principal weakness of aramid (Kevlar) fibres in construction composites is:", "o": ["Very low tensile strength", "Poor compressive strength together with UV and moisture sensitivity", "Very high density", "Brittle failure under impact"], "a": 1, "e": "Aramid has excellent tensile strength and toughness but poor compression and environmental sensitivity."}, {"t": "FRP", "q": "The transverse coefficient of thermal expansion of FRP bars is:", "o": ["Lower than that of concrete", "Equal to that of concrete", "Several times that of concrete, which can cause splitting under heating", "Negative for GFRP"], "a": 2, "e": "Resin dominates transverse behaviour, giving high CTE; thermal cycling can crack the surrounding concrete."}, {"t": "Natural & Bio", "q": "Which of the following is a leaf fibre?", "o": ["Sisal", "Kenaf", "Coir", "Ramie"], "a": 0, "e": "Sisal (and banana, abaca, pineapple) are leaf fibres; kenaf and ramie are bast fibres; coir is a fruit (husk) fibre."}, {"t": "Natural & Bio", "q": "A lower microfibril angle in a natural fibre generally results in:", "o": ["Lower stiffness and higher strength", "Higher moisture regain only", "No change in mechanical properties", "Higher stiffness and tensile strength but lower elongation"], "a": 3, "e": "Microfibrils aligned close to the fibre axis carry load more efficiently."}, {"t": "Natural & Bio", "q": "Natural fibre degradation in a cement matrix is chiefly caused by:", "o": ["Acid rain", "Ultraviolet exposure only", "Galvanic action with reinforcement", "Alkaline attack and mineralisation from Ca(OH)₂ migrating into the fibre"], "a": 3, "e": "Lignin and hemicellulose dissolve in the pore solution and cellulose becomes embrittled by calcium hydroxide deposition."}, {"t": "Natural & Bio", "q": "Which measure best reduces the alkali degradation of natural fibres in cement composites?", "o": ["Partial replacement of cement by pozzolans such as metakaolin or silica fume", "Increasing the water–cement ratio", "Increasing curing temperature to 90 °C", "Using coarser aggregate"], "a": 0, "e": "Pozzolans consume Ca(OH)₂, lowering matrix alkalinity."}, {"t": "Natural & Bio", "q": "The cyclic wetting and drying of natural fibres in cement matrices results in:", "o": ["Increased fibre stiffness", "Swelling and shrinking of fibres, creating debonding gaps at the interface", "Improved chemical bond", "Lower permeability of the composite"], "a": 1, "e": "Fibre volume changes in response to moisture and weaken the interface."}, {"t": "Natural & Bio", "q": "Which component of natural fibres is the least thermally stable and most hydrophilic?", "o": ["Lignin", "Hemicellulose", "Crystalline cellulose", "Wax"], "a": 1, "e": "Hemicellulose degrades first (roughly 200–260 °C) and absorbs the most moisture."}, {"t": "Natural & Bio", "q": "Polylactic acid (PLA) is produced from:", "o": ["Lactic acid (via lactide) obtained by fermenting plant sugars or starch", "Bacterial storage granules in the cell", "Epoxidised vegetable oil", "Cross-linked phenol and formaldehyde"], "a": 0, "e": "PLA is a bio-based thermoplastic polyester made from fermented sugars; industrially compostable."}, {"t": "Natural & Bio", "q": "Polyhydroxyalkanoates (PHAs) are:", "o": ["Cellulose derivatives extracted from wood", "Biopolyesters synthesised by microorganisms through fermentation", "Petroleum-based epoxies", "Cross-linked lignin resins"], "a": 1, "e": "Bacteria accumulate PHAs as energy storage, giving fully bio-based, biodegradable polymers."}, {"t": "Natural & Bio", "q": "Strength development and carbon uptake in hempcrete come mainly from:", "o": ["Alkali–silica gel formation", "Carbonation of the lime binder", "Gypsum hydration", "Pozzolanic reaction of hemp ash"], "a": 1, "e": "Lime binder reacts with atmospheric CO₂ to form calcium carbonate over time, hardening the mix and sequestering CO₂."}, {"t": "Natural & Bio", "q": "Hempcrete is described as 'breathable' because of:", "o": ["High compressive strength", "High thermal mass alone", "A waterproof binder", "Vapour permeability and hygroscopic moisture buffering"], "a": 3, "e": "It absorbs and releases moisture, moderating indoor humidity, while allowing vapour to pass."}, {"t": "Natural & Bio", "q": "The growth of mycelium composites is halted, after forming the shape, by:", "o": ["Adding lime", "Immersion in cement slurry", "Heat drying to kill the fungus", "UV bleaching"], "a": 2, "e": "Heat-killing stops growth and makes the material inert and dry."}, {"t": "Natural & Bio", "q": "Coir geotextiles outlast jute geotextiles "e": "CLT out-of-plane shear is limited by the low rolling shear strength of the transverse layers."}, {"t": "Timber & Bamboo", "q": "A 200 mm × 300 mm glulam beam is exposed to fire on three sides for 60 minutes. Using a char rate of 0.65 mm/min, the charring depth is:", "o": ["39 mm", "65 mm", "19.5 mm", "78 mm"], "a": 0, "e": "0.65 × 60 = 39 mm. Structural capacity is then checked on the residual (reduced) section."}, {"t": "Timber & Bamboo", "q": "Plywood is made with an odd number of plies mainly to:", "o": ["Increase the thickness only", "Provide symmetry about the core with adjacent grain at 90°, reducing warping", "Make sanding easier", "Use less adhesive"], "a": 1, "e": "Symmetrical layup balances shrinkage/swelling forces."}, {"t": "Timber & Bamboo", "q": "Timber begins to shrink appreciably when its moisture content falls below:", "o": ["The equilibrium moisture content of 12%", "The oven-dry point", "The fibre saturation point (about 25–30%)", "The point of full saturation"], "a": 2, "e": "Above fibre saturation only free water leaves and dimensions don't change; below it, bound water leaves and the cell walls shrink."}, {"t": "Timber & Bamboo", "q": "In timber–concrete composite floors, timber and concrete are best placed:", "o": ["Timber in tension in the lower zone and concrete in compression at the top", "Concrete in tension at the bottom", "Timber and concrete both on top of one another with no connection", "Concrete on the sides"], "a": 0, "e": "Placing each material in the stress state it handles best raises stiffness and adds mass for acoustics."}, {"t": "Timber & Bamboo", "q": "In OSB, strands in the outer layers are typically aligned:", "o": ["Randomly in all layers", "Parallel to the panel's strong axis, with the core layers cross-oriented", "Perpendicular to the strong axis", "At 45° in all layers"], "a": 1, "e": "Aligned surface strands provide bending strength along the panel; cross-oriented core provides balance."}, {"t": "Timber & Bamboo", "q": "Wood–plastic composite (WPC) decking is not used for primary structure mainly because of:", "o": ["Creep and low stiffness relative to timber", "High density", "Poor moisture resistance", "Rapid rot"], "a": 0, "e": "Thermoplastic matrices creep under load; WPC is best used as non-structural decking or cladding."}, {"t": "Timber & Bamboo", "q": "Which bamboo product is made by crushing culms into fibre bundles that are resin-impregnated and pressed?", "o": ["Bamboo mat board", "Bamboo mat corrugated sheet", "Bamboo plywood", "Scrimber / strand-woven bamboo"], "a": 3, "e": "Strand-woven bamboo has very high density and strength compared to natural culms."}, {"t": "Timber & Bamboo", "q": "Which adhesive is generally used for exterior or marine plywood?", "o": ["Urea-formaldehyde", "Casein", "Phenol-formaldehyde", "Starch-based glue"], "a": 2, "e": "Phenolic resins form water-boil-proof bonds; urea-formaldehyde is for interior use."}, {"t": "Sandwich & Glass", "q": "Face wrinkling in a sandwich panel occurs:", "o": ["In the tension face when the core is too thick", "At the supports only due to bearing", "In the compressive face when the core stiffness is insufficient", "Only when the core is honeycomb"], "a": 2, "e": "The thin compression skin buckles locally on an elastic foundation (the core)."}, {"t": "Sandwich & Glass", "q": "If the core thickness of a sandwich panel (thin faces, constant face thickness) is doubled, the flexural stiffness approximately:", "o": ["Increases four-fold", "Doubles", "Increases eight-fold", "Remains unchanged"], "a": 0, "e": "For thin faces D ≈ E_f·t·d²/2 per width, so stiffness varies with the square of the distance between face centroids."}, {"t": "Sandwich & Glass", "q": "A structural advantage of SGP interlayers over PVB in laminated glass is:", "o": ["Greater interlayer stiffness improving post-breakage and composite behaviour", "Lower cost", "Greater flexibility", "Lower tear resistance"], "a": 0, "e": "SGP is much stiffer and stronger than PVB, giving better load sharing between plies."}, {"t": "Sandwich & Glass", "q": "For a sandwich beam with a soft core, deflection is:", "o": ["Independent of core properties", "Governed by face tension only", "Increased noticeably by shear deformation of the core", "Decreased by low core shear modulus"], "a": 2, "e": "Total deflection is the sum of bending and shear components; low core shear modulus increases the latter."}, {"t": "Sandwich & Glass", "q": "Fire-retardant (FR) aluminium composite panels differ from standard panels by having:", "o": ["A mineral-filled core", "Thicker aluminium skins only", "A polyethylene core", "A honeycomb core"], "a": 0, "e": "Mineral-filled cores reduce combustibility; PE-core panels are hazardous in tall buildings."}, {"t": "Sandwich & Glass", "q": "For overhead glazing, the appropriate glass type to prevent fall-out after breakage is:", "o": ["Laminated glass", "Annealed float glass", "Toughened glass alone", "Wired glass"], "a": 0, "e": "Interlayers hold fragments in place; toughened glass alone can fall out as small fragments."}, {"t": "Sandwich & Glass", "q": "The bending stiffness of a SIP wall panel is primarily due to:", "o": ["The foam core alone", "The adhesive alone", "The edge splines", "OSB facings acting compositely through the foam core"], "a": 3, "e": "The foam core separates and stabilises the facings, transferring shear."}, {"t": "Sandwich & Glass", "q": "The core of high-pressure laminates (HPL) consists of:", "o": ["Kraft paper layers impregnated with phenolic resin", "Melamine-only sheets", "Compressed cement fibres", "Polyurethane foam"], "a": 0, "e": "Kraft paper with phenolic resin forms the core; melamine-impregnated decorative and overlay sheets form the surface."}, {"t": "Sustainability", "q": "Which design principle improves reuse of steel–concrete composite floors?", "o": ["Using more welded studs", "Casting monolithic slabs", "Using thicker concrete cover", "Design for disassembly using demountable bolted connectors and precast slabs"], "a": 3, "e": "Demountable shear connectors allow beams and slabs to be separated and reused rather than crushed."}, {"t": "Sustainability", "q": "Most embodied carbon in concrete arises from:", "o": ["Calcination of limestone and fuel used to produce cement clinker", "Transport of aggregates", "Steel reinforcement production", "Mixing water"], "a": 0, "e": "Cement production emits process CO₂ from limestone and combustion CO₂ from kiln fuel."}, {"t": "Sustainability", "q": "Regarding biogenic carbon in timber composites, the most defensible statement is:", "o": ["It is always carbon-negative regardless of source", "It is released immediately upon harvest", "It is not counted in any LCA", "It counts as a benefit only if wood is sustainably sourced and retained in use"], "a": 3, "e": "Sequestration depends on forest regrowth and the fate of the timber at end-of-life."}, {"t": "Sustainability", "q": "Environmental Product Declarations (EPDs) for construction products follow:", "o": ["ISO 14001", "ISO 14025 (with EN 15804 for construction products)", "ISO 9001", "ISO 50001"], "a": 1, "e": "ISO 14025 governs Type III declarations; EN 15804 supplies product category rules for construction products. ISO 14001 is EMS, ISO 9001 QMS, ISO 50001 energy management."}, {"t": "Sustainability", "q": "A cradle-to-gate LCA typically includes modules:", "o": ["A1–A5", "B1–B7", "C1–C4", "A1–A3 (raw material supply, transport, manufacturing)"], "a": 3, "e": "Cradle-to-gate stops at the factory gate; construction (A4–A5), use (B) and end of life (C) are excluded."}, {"t": "Sustainability", "q": "Which class of polymer allows remelting and reshaping at end-of-life?", "o": ["Epoxy thermosets", "Phenolic thermosets", "Vinyl ester thermosets", "Thermoplastics such as PP, PA and PLA"], "a": 3, "e": "Thermoplastics soften on heating; thermosets are cross-linked and cannot be remelted."}, {"t": "Sustainability", "q": "The principal durability concern for GFRP rebars in concrete pore solution (pH about 13) is:", "o": ["Chloride-induced pitting", "Hydroxyl attack on glass fibres and the fibre–resin interface", "Sulphate expansion", "Galvanic corrosion"], "a": 1, "e": "High pH degrades glass and the sizing/interface; vinyl ester resins and good-quality glass reduce this."}, {"t": "FRP", "q": "Under sustained load, which FRP type has the most restrictive creep-rupture stress limit in ACI 440 guidance?", "o": ["CFRP", "AFRP", "All types are limited equally", "GFRP"], "a": 3, "e": "Approximate sustained-stress limits are about 0.20 of ultimate for GFRP, 0.30 for AFRP and 0.55 for CFRP, so GFRP governs service-stress checks."}];
const KEY = "composite-mcq-100-v1";
const LET = ["A","B","C","D"];
let st = {ans:{}, star:{}, theme:null, shuffled:false, order:null, cur:0};
try{ const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s) st=Object.assign(st,s);}catch(e){}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){} }

const $ = id => document.getElementById(id);
const topics = ["All topics", ...Array.from(new Set(DATA.map(d=>d.t)))];
topics.forEach((t,i)=>{const o=document.createElement("option");o.value=i?t:"";o.textContent=t;$("topicSel").appendChild(o);});

function baseOrder(){
  if(st.shuffled && st.order && st.order.length===DATA.length) return st.order;
  return DATA.map((_,i)=>i);
}
let list=[], pos=0;
function buildList(keepId){
  const tp=$("topicSel").value, fl=$("filterSel").value;
  list = baseOrder().filter(i=>{
    const d=DATA[i], a=st.ans[i];
    if(tp && d.t!==tp) return false;
    if(fl==="new") return a===undefined;
    if(fl==="right") return a!==undefined && a===d.a;
    if(fl==="wrong") return a!==undefined && a!==d.a;
    if(fl==="star") return !!st.star[i];
    return true;
  });
  pos = keepId!==undefined && list.indexOf(keepId)>=0 ? list.indexOf(keepId) : 0;
}

function stats(){
  const done=Object.keys(st.ans).length;
  const right=Object.keys(st.ans).filter(k=>st.ans[k]===DATA[k].a).length;
  return {done,right};
}
function paintTop(){
  const {done,right}=stats(), n=DATA.length;
  $("barFill").style.width=(done/n*100)+"%";
  const acc=done?Math.round(right/done*100):0;
  $("progText").textContent=done+" of "+n+" answered · "+right+" correct · "+acc+"% accuracy"+(done===n?" · Complete":"");
  $("scoreChip").textContent="Score "+right+" / "+n;
}

function render(){
  paintTop();
  const stage=$("stage"); stage.innerHTML="";
  if(!list.length){
    const e=document.createElement("div");e.className="card empty";
    e.textContent="No questions match this topic and filter. Change the filter to continue.";
    stage.appendChild(e); paintGrid(); return;
  }
  const id=list[pos], d=DATA[id], a=st.ans[id], answered=a!==undefined;
  st.cur=id; save();

  const card=document.createElement("section");card.className="card";
  const meta=document.createElement("div");meta.className="meta";
  const left=document.createElement("span");
  const tag=document.createElement("span");tag.className="tag";tag.textContent=d.t;
  left.append(tag," Question "+(pos+1)+" of "+list.length);
  const star=document.createElement("button");star.className="star"+(st.star[id]?" on":"");
  star.textContent=st.star[id]?"Bookmarked":"Bookmark";
  star.setAttribute("aria-pressed",!!st.star[id]);
  star.onclick=()=>{ if(st.star[id]) delete st.star[id]; else st.star[id]=1; save(); render(); };
  meta.append(left,star);

  const q=document.createElement("p");q.className="q";q.textContent=d.q;
  const opts=document.createElement("div");opts.className="opts";
  d.o.forEach((txt,i)=>{
    const b=document.createElement("button");b.className="opt";b.type="button";
    const k=document.createElement("span");k.className="k";k.textContent=LET[i];
    const t=document.createElement("span");t.textContent=txt;
    b.append(k,t);
    if(answered){
      b.disabled=true;
      if(i===d.a) b.classList.add("ok");
      else if(i===a) b.classList.add("bad");
    } else b.onclick=()=>choose(id,i);
    opts.appendChild(b);
  });
  card.append(meta,q,opts);

  if(answered){
    const ex=document.createElement("div");
    const right=a===d.a; ex.className="expl "+(right?"ok":"bad");
    const h=document.createElement("b");
    h.textContent=right?"Correct":"Incorrect — the answer is "+LET[d.a];
    const p=document.createElement("span");p.textContent=d.e;
    ex.append(h,p); card.appendChild(ex);
  }
  const nav=document.createElement("div");nav.className="nav";
  const pv=document.createElement("button");pv.className="btn";pv.textContent="Previous";pv.disabled=pos===0;pv.onclick=()=>go(-1);
  const nx=document.createElement("button");nx.className="btn primary";nx.textContent="Next";nx.disabled=pos===list.length-1;nx.onclick=()=>go(1);
  nav.append(pv,nx); card.appendChild(nav);
  stage.appendChild(card);
  paintGrid();
}
function choose(id,i){ if(st.ans[id]!==undefined) return; st.ans[id]=i; save(); render(); }
function go(d){ const np=pos+d; if(np<0||np>=list.length) return; pos=np; render(); window.scrollTo({top:0,behavior:"smooth"}); }

function paintGrid(){
  const g=$("grid"); g.innerHTML="";
  list.forEach((id,i)=>{
    const b=document.createElement("button");b.textContent=i+1;
    b.setAttribute("aria-label","Question "+(i+1));
    const a=st.ans[id];
    if(a!==undefined) b.classList.add(a===DATA[id].a?"ok":"bad");
    if(i===pos) b.classList.add("cur");
    b.onclick=()=>{pos=i;render();window.scrollTo({top:0,behavior:"smooth"});};
    g.appendChild(b);
  });
}

$("topicSel").onchange=()=>{buildList();render();};
$("filterSel").onchange=()=>{buildList();render();};
$("shuffleBtn").onclick=()=>{
  st.shuffled=!st.shuffled;
  if(st.shuffled){ const o=DATA.map((_,i)=>i); for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]];} st.order=o; }
  $("shuffleBtn").classList.toggle("on",st.shuffled);
  $("shuffleBtn").setAttribute("aria-pressed",st.shuffled);
  save(); buildList(); render();
};
$("resetBtn").onclick=()=>{
  if(!confirm("Clear all answers and bookmarks?")) return;
  st.ans={}; st.star={}; st.cur=0; save(); buildList(); render();
};
$("jumpBtn").onclick=()=>{
  const g=$("grid"); g.hidden=!g.hidden; $("jumpBtn").setAttribute("aria-expanded",!g.hidden);
};
function applyTheme(){
  const t=st.theme || (window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  document.documentElement.setAttribute("data-theme",t);
  $("themeBtn").textContent=t==="dark"?"Light":"Dark";
}
$("themeBtn").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  st.theme=cur==="dark"?"light":"dark"; save(); applyTheme();
};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT"||e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key.toLowerCase();
  if(k==="arrowright") go(1);
  else if(k==="arrowleft") go(-1);
  else if("abcd".includes(k)&&k.length===1&&list.length){ choose(list[pos],"abcd".indexOf(k)); }
});

applyTheme();
$("shuffleBtn").classList.toggle("on",!!st.shuffled);
buildList(st.cur); render();
</script>
</body>
</html>
